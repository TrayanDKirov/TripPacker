<button mat-icon-button (click)="refresh()">
  <mat-icon>refresh</mat-icon>
</button>

<table mat-table [dataSource]="items" class="mat-elevation-z8">

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
  </ng-container>

  <ng-container matColumnDef="quantity-to-pack">
    <th mat-header-cell *matHeaderCellDef> Quantity to pack </th>
    <td mat-cell *matCellDef="let element"> {{element.quantityToPack}} </td>
  </ng-container>

  <ng-container matColumnDef="delete-button">
    <th mat-header-cell *matHeaderCellDef> Delete </th>
    <td mat-cell *matCellDef="let element"> 
      <button mat-icon-button (click)="deleteItemById(element.id)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
