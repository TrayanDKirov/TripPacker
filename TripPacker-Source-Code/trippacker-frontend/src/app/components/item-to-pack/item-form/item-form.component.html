<mat-accordion>
  <mat-expansion-panel hideToggle>
    <mat-expansion-panel-header>
      <mat-panel-title>Add item here</mat-panel-title>
    </mat-expansion-panel-header>

    <form (ngSubmit)="onSubmit()">

      <mat-form-field>
        <mat-label>Name of item</mat-label>
        <input matInput type="text" [(ngModel)]="createDto.name" name="itemName">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Quantity to pack</mat-label>
        <input matInput type="number" [(ngModel)]="createDto.quantityToPack" name="quantityToPack">
      </mat-form-field>

      <button matButton="tonal">Add</button>
    </form>

  </mat-expansion-panel>
</mat-accordion>
