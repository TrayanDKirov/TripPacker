<section>
  <button matFab extended routerLink="/trips"> Back to Trips </button>
</section>

<form (ngSubmit)="onSubmit()">
  <mat-card class="group-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title> {{editableTrip.name}} </mat-card-title>
      <mat-card-subtitle> Trip Luggage </mat-card-subtitle>
      <button matFab extended> Save </button>
    </mat-card-header>
    <mat-card-content>
      <packing-group *ngFor="let packingGroup of editableTrip.packingGroups" [packingGroup]="packingGroup"></packing-group>
    </mat-card-content>
    <mat-card-actions>

    </mat-card-actions>
  </mat-card>
</form>
