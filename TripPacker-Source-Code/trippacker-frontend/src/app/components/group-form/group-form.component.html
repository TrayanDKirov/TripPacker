<mat-accordion>
  <mat-expansion-panel hideToggle>
    <mat-expansion-panel-header>
      <mat-panel-title>Create group here</mat-panel-title>
    </mat-expansion-panel-header>
    <form (ngSubmit)="onSubmit()">
      <mat-form-field>
        <mat-label>Name of group</mat-label>
        <input matInput type="text" [(ngModel)]="createDto.name" name="groupName">
      </mat-form-field>
      <button matButton="tonal" >Create</button>
    </form>
  </mat-expansion-panel>
</mat-accordion>
