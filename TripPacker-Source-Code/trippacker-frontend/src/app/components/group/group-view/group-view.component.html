<section>
  <button matFab extended routerLink="/groups"> Back to Groups </button>
</section>

<mat-card class="group-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{group?.name}}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <item-form [groupId]="group?.id"></item-form>
    <item-list [groupId]="group?.id" [items]="group?.items"></item-list>
  </mat-card-content>
  <mat-card-actions>
    
  </mat-card-actions>
</mat-card>
