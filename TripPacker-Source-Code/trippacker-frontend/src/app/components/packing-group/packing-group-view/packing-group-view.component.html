<mat-card class="group-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{packingGroup.name}}</mat-card-title>
    <mat-card-subtitle>Packing Group</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>

    <table mat-table [dataSource]="packingGroup.items" class="mat-elevation-z8">

      <ng-container matColumnDef="check-button">
          <th mat-header-cell *matHeaderCellDef> Packed </th>
          <td mat-cell *matCellDef="let element;let i = index"> 
              <mat-checkbox [(ngModel)]="element.isPacked" class="example-margin" name="checkbox{{i}}"></mat-checkbox>
          </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <ng-container matColumnDef="packed-quantity">
        <th mat-header-cell *matHeaderCellDef> Packed  </th>
        <td mat-cell *matCellDef="let element"> 
          <mat-form-field>
            <mat-label>Packed Quantity</mat-label>
            <input matInput type="number" [(ngModel)]="element.packedQuantity" name="itemPackedQuantity">
          </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="quantity-to-pack">
        <th mat-header-cell *matHeaderCellDef> To Pack </th>
        <td mat-cell *matCellDef="let element"> {{element.quantityToPack}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

  </mat-card-content>
  <mat-card-actions>
  </mat-card-actions>
</mat-card>
